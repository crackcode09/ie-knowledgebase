<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · IE Knowledgebase</title>
<meta name="description" content="__TITLE__ for the IE Knowledgebase site.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1f1d18; --surface: #2a2721; --surface-2: #343028; --line: #3e392f;
    --text: #ede6da; --muted: #9c937f; --accent: #d97757; --accent-soft: rgba(217,119,87,.14);
    --green: #9cba7f; --green-soft: rgba(156,186,127,.16); --bg-rgb: 31,29,24;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: "Space Grotesk", "Inter", -apple-system, sans-serif;
    --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --shadow-1: 0 1px 2px rgba(0,0,0,.25);
  }
  :root[data-theme="light"] {
    --bg: #faf6ee; --surface: #ffffff; --surface-2: #f1ebdf; --line: #e3dccb; --text: #2a2721; --muted: #7a7262;
    --accent: #c4623c; --accent-soft: rgba(196,98,60,.12); --green: #5f8a3d; --green-soft: rgba(95,138,61,.14);
    --bg-rgb: 250,246,238; --shadow-1: 0 1px 2px rgba(60,40,20,.08);
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    --bg: #faf6ee; --surface: #ffffff; --surface-2: #f1ebdf; --line: #e3dccb; --text: #2a2721; --muted: #7a7262;
    --accent: #c4623c; --accent-soft: rgba(196,98,60,.12); --green: #5f8a3d; --green-soft: rgba(95,138,61,.14);
    --bg-rgb: 250,246,238; --shadow-1: 0 1px 2px rgba(60,40,20,.08); } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  button { font: inherit; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); padding: var(--s2) var(--s5);
    background: rgba(var(--bg-rgb), .92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 13px; }
  .path { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .path .dot { color: var(--green); } .path b { color: var(--text); font-weight: 500; } .path a { color: var(--muted); text-decoration: none; } .path a:hover { color: var(--accent); }
  .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12.5px; color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--accent); }
  .toggle { display: flex; } .toggle .btn { border-radius: 0; } .toggle .btn:first-child { border-radius: 6px 0 0 6px; } .toggle .btn:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  main { max-width: 820px; margin: 0 auto; padding: var(--s7) var(--s4) var(--s7); }
  .eyebrow { font-family: var(--mono); font-size: 13px; color: var(--green); margin-bottom: var(--s4); }
  .eyebrow::before { content: "$ "; color: var(--muted); }
  h1 { font-family: var(--display); font-size: clamp(30px, 4vw, 44px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin-bottom: var(--s3); }
  .meta { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-bottom: var(--s6); }
  h2 { font-family: var(--display); font-size: 21px; font-weight: 700; letter-spacing: -.01em; margin: var(--s6) 0 var(--s3); scroll-margin-top: 70px; }
  h2::before { content: "#"; color: var(--accent); font-family: var(--mono); font-weight: 400; margin-right: 8px; }
  h3 { font-size: 16px; font-weight: 600; margin: var(--s5) 0 var(--s2); }
  p, ul, ol { margin-bottom: var(--s4); } li { margin-bottom: 6px; } ul, ol { padding-left: 1.4em; }
  code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .box { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--surface); padding: var(--s3) var(--s4); margin: var(--s4) 0; font-size: 14.5px; color: var(--muted); }
  .box b { color: var(--text); }
  table { border-collapse: collapse; width: 100%; margin-bottom: var(--s4); font-size: 14.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-family: var(--mono); font-weight: 500; font-size: 12.5px; color: var(--muted); }
  .toc { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-bottom: var(--s5); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .toc a { color: var(--muted); text-decoration: none; } .toc a:hover { color: var(--accent); }
  footer { border-top: 1px solid var(--line); padding: var(--s5); text-align: center; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  footer a { color: inherit; } footer a:hover { color: var(--accent); }
  @media print { .topbar, footer { display: none; } body { background: #fff; color: #000; } main { padding: 0; } a { color: inherit; } }
</style>
</head>
<body>
<div class="topbar">
  <span class="path"><span class="dot">~</span>/<a href="index.html">ie-knowledgebase</a>/<b>__KEY__.html</b></span>
  <nav class="toggle" aria-label="Site views">
    <a class="btn" href="index.html">Catalog</a>
    <a class="btn" href="index.html#tab=path">Learning path</a>
    <a class="btn" href="index.html#tab=graph">Mind map</a>
  </nav>
  <span class="spacer"></span>
  <button type="button" class="btn" id="btnTheme" aria-label="Toggle light or dark theme">theme</button>
</div>
<main>
__BODY__
</main>
<footer>content CC BY 4.0 · code MIT · <a href="privacy.html">privacy</a> · <a href="terms.html">terms</a> · <a href="https://github.com/crackcode09/ie-knowledgebase/blob/main/NOTICE.md" rel="noopener">notice</a> · <a href="index.html">back to the catalog</a></footer>
<script>
  (function () {
    const root = document.documentElement;
    try { const saved = localStorage.getItem('iekb-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
    document.getElementById('btnTheme').addEventListener('click', () => {
      const light = matchMedia('(prefers-color-scheme: light)').matches;
      const cur = root.getAttribute('data-theme') || (light ? 'light' : 'dark');
      const next = cur === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('iekb-theme', next); } catch (e) {}
    });
  })();
</script>
</body>
</html>
