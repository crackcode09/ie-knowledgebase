<style>
  :root {

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Controls: one height, a visible edge, a filled state for the active one */

  .tl-head:hover .tl-title { color: var(--accent); }

<script>
  (function () {
    const root = document.documentElement;
    try { const saved = localStorage.getItem('iekb-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
    document.getElementById('btnTheme').addEventListener('click', () => {
