<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const REPO = DATA.repo;
  const nodes = DATA.nodes, byId = new Map(nodes.map(d => [d.id, d]));
  const courses = nodes.filter(d => d.type === 'course');
  const byRoot = new Map(courses.map(c => [c.path.replace(/\/README\.md$/, ''), c]));
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = id => document.getElementById(id);

  // ---- theme
  const root = document.documentElement;
  try { const saved = localStorage.getItem('iekb-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  $('btnTheme').addEventListener('click', () => {
    const dark = root.getAttribute('data-theme') === 'dark' || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    const next = dark ? 'light' : 'dark'; root.setAttribute('data-theme', next);
    try { localStorage.setItem('iekb-theme', next); } catch (e) {}
    if (document.querySelector('pre.mermaid')) location.reload();
  });

  // ---- progress stores (course-level and module-level), this browser only
  const load = k => { try { return new Set(JSON.parse(localStorage.getItem(k) || '[]')); } catch (e) { return new Set(); } };
  const save = (k, s) => { try { localStorage.setItem(k, JSON.stringify([...s])); } catch (e) {} };
  const doneCourses = load('iekb-done'), doneMods = load('iekb-mods');

  // ---- which course and file
  const params = new URLSearchParams(location.search);
  const slug = params.get('c') || '';
  const course = courses.find(c => c.id === 'course:' + slug) || courses[0];
  const courseRoot = course.path.replace(/\/README\.md$/, '');
  let file = params.get('f') || 'README.md';
  if (file.includes('..')) file = 'README.md';
  const modules = nodes.filter(n => n.type === 'module' && n.parent === course.id).map(m => ({ ...m, rel: m.path.slice(courseRoot.length + 1) }));
  const extras = course.extras || [];
  const cat = byId.get(course.parent);
  const modKey = rel => `${courseRoot}/${rel}`;
  const isReadme = file === 'README.md';

  // ---- hero and nav
  $('pathCourse').innerHTML = `<a href="index.html#course:${esc(slug)}">${esc(slug)}</a>`;
  $('pathFile').textContent = file.split('/').pop(); $('eyebrowFile').textContent = file;
  document.title = `${course.label} · IE Knowledgebase`;
  $('btnGithub').href = `${REPO}/blob/main/${courseRoot}/${file}`;
  function renderHero() {
    const cur = modules.find(m => m.rel === file);
    $('title').innerHTML = cur ? `${esc(course.label)} <span class="md">· ${esc(cur.label)}</span>` : `${esc(course.label)}<span class="md">.</span>`;
    const done = doneCourses.has(course.id);
    $('byline').innerHTML = `<span class="chip"><a href="index.html" style="color:inherit;text-decoration:none">${esc(cat.label)}</a></span>` +
      (course.length ? `<span class="chip">${esc(course.length)}</span>` : '') +
      `<span class="chip">${modules.length} modules · ${modules.filter(m => doneMods.has(modKey(m.rel))).length} done</span>` +
      (done ? '<span class="chip green">✓ course done</span>' : '');
    $('lede').textContent = isReadme ? '' : (course.description || '');
    $('lede').style.display = isReadme ? 'none' : '';
  }
  function renderToc() {
    let h = '<div class="toc-title">Course</div>' + `<a href="course.html?c=${esc(slug)}" class="${isReadme ? 'current' : ''}"><span class="n">#</span>Overview</a>`;
    h += '<div class="toc-title">Modules</div>' + modules.map((m, i) => `<a href="course.html?c=${esc(slug)}&f=${encodeURIComponent(m.rel)}" class="${m.rel === file ? 'current' : ''} ${doneMods.has(modKey(m.rel)) ? 'mdone' : ''}"><span class="n">${doneMods.has(modKey(m.rel)) ? '✓' : i}</span><span>${esc(m.label)}</span>${m.note ? `<span class="t">${esc(m.note)}</span>` : ''}</a>`).join('');
    if (extras.length) h += '<div class="toc-title">Reference</div>' + extras.map(x => `<a href="course.html?c=${esc(slug)}&f=${encodeURIComponent(x.path)}" class="${x.path === file ? 'current' : ''}"><span class="n">·</span><span>${esc(x.label)}</span></a>`).join('');
    $('toc').innerHTML = h;
  }

  // ---- path helpers for rewriting links and images
  function resolve(base, href) {
    const parts = (base ? base.split('/').slice(0, -1) : []).concat(href.split('/'));
    const out = [];
    for (const p of parts) { if (p === '..') out.pop(); else if (p !== '.' && p !== '') out.push(p); }
    return out.join('/');
  }
  function rewriteLinks(container) {
    container.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (/^(https?:|mailto:|#)/.test(href)) { if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; } return; }
      const [path, hash] = href.split('#');
      const inCourse = resolve(file, path);               // relative to this course root (may contain ..)
      const absolute = resolve(courseRoot + '/' + file, path); // relative to repo root
      if (/\.md$/i.test(path)) {
        if (!inCourse.startsWith('..') && !absolute.startsWith('..') && absolute.startsWith(courseRoot + '/')) {
          a.href = `course.html?c=${slug}&f=${encodeURIComponent(inCourse)}` + (hash ? '#' + hash : '');
        } else {
          const other = [...byRoot.keys()].find(r => absolute === r + '/README.md' || absolute.startsWith(r + '/'));
          a.href = other ? `course.html?c=${byRoot.get(other).id.slice(7)}&f=${encodeURIComponent(absolute.slice(other.length + 1))}` : `${REPO}/blob/main/${absolute}`;
        }
      } else {
        a.href = `${REPO}/blob/main/${absolute}`; a.target = '_blank'; a.rel = 'noopener';
      }
    });
    container.querySelectorAll('img[src]').forEach(img => {
      const src = img.getAttribute('src');
      if (/^(https?:|data:)/.test(src)) return;
      img.src = 'courses/' + courseRoot.replace(/^courses\//, '') + '/' + resolve(file, src);
    });
  }

  // ---- render
  let RAW = '';
  function renderRaw(md) {
    return md.replace(/\r\n/g, '\n').split('\n').map(l => { let c = 'ln'; if (/^#{1,6}\s/.test(l)) c += ' h'; else if (/^```/.test(l)) c += ' fence'; return `<span class="${c}">${esc(l) || ' '}</span>`; }).join('');
  }
  function mount(md) {
    RAW = md;
    marked.use({ gfm: true, breaks: false });
    const el = $('rendered');
    el.innerHTML = marked.parse(md);
    el.querySelectorAll('h1, h2, h3, h4').forEach(h => { if (!h.id) h.id = h.textContent.toLowerCase().replace(/[^a-z0-9 -]/g, '').trim().replace(/\s+/g, '-'); });
    rewriteLinks(el);
    const mer = [...el.querySelectorAll('pre > code.language-mermaid')];
    if (mer.length) {
      mer.forEach(c => { const pre = c.parentElement; const d = document.createElement('pre'); d.className = 'mermaid'; d.textContent = c.textContent; pre.replaceWith(d); });
      const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js';
      s.onload = () => { const dark = getComputedStyle(root).getPropertyValue('--bg').trim() === '#1f1d18'; mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral' }); mermaid.run(); };
      document.body.appendChild(s);
    }
    $('rawPre').innerHTML = renderRaw(md);
    $('status').innerHTML = `source: <b>${esc(courseRoot)}/${esc(file)}</b> · ${md.split('\n').length} lines · ${(md.length / 1024).toFixed(1)} KB`;
    if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
    updateProgress();
  }
  function renderPager() {
    const i = modules.findIndex(m => m.rel === file);
    const prev = i > 0 ? modules[i - 1] : (i === 0 ? { rel: 'README.md', label: 'Overview' } : null);
    const next = i >= 0 && i < modules.length - 1 ? modules[i + 1] : (isReadme && modules.length ? modules[0] : null);
    const link = (m, cls, lab) => m ? `<a class="${cls}" href="course.html?c=${esc(slug)}${m.rel === 'README.md' ? '' : '&f=' + encodeURIComponent(m.rel)}"><small>${lab}</small>${esc(m.label)}</a>` : '<span style="flex:1"></span>';
    let mark = '';
    if (i >= 0) { const k = modKey(file), d = doneMods.has(k); mark = `<button type="button" class="mark ${d ? 'done' : ''}" id="markMod"><small>progress</small>${d ? '✓ module done' : 'mark module done'}</button>`; }
    else if (isReadme) { const d = doneCourses.has(course.id); mark = `<button type="button" class="mark ${d ? 'done' : ''}" id="markCourse"><small>progress</small>${d ? '✓ course done' : 'mark course done'}</button>`; }
    $('pager').innerHTML = link(prev, 'prev', 'previous') + mark + link(next, 'next', 'next');
    const mm = $('markMod'); if (mm) mm.addEventListener('click', () => { const k = modKey(file); if (doneMods.has(k)) doneMods.delete(k); else doneMods.add(k); save('iekb-mods', doneMods);
      if (modules.every(m => doneMods.has(modKey(m.rel)))) { doneCourses.add(course.id); save('iekb-done', doneCourses); }
      renderHero(); renderToc(); renderPager(); });
    const mc = $('markCourse'); if (mc) mc.addEventListener('click', () => { if (doneCourses.has(course.id)) doneCourses.delete(course.id); else doneCourses.add(course.id); save('iekb-done', doneCourses); renderHero(); renderPager(); });
  }

  // ---- chrome
  function setMode(raw) { document.body.classList.toggle('raw-mode', raw); $('btnRaw').classList.toggle('active', raw); $('btnRendered').classList.toggle('active', !raw); }
  $('btnRendered').addEventListener('click', () => setMode(false)); $('btnRaw').addEventListener('click', () => setMode(true));
  $('btnCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(RAW); $('btnCopy').textContent = 'Copied'; setTimeout(() => $('btnCopy').textContent = 'Copy', 1500); } catch (e) { setMode(true); } });
  function updateProgress() { const h = document.documentElement; const max = h.scrollHeight - h.clientHeight; $('progress').style.width = (max > 0 ? 100 * h.scrollTop / max : 0) + '%'; }
  window.addEventListener('scroll', updateProgress, { passive: true });

  // ---- boot
  renderHero(); renderToc(); renderPager();
  fetch(`courses/${courseRoot.replace(/^courses\//, '')}/${file}`, { cache: 'no-store' })
    .then(r => r.ok ? r.text() : Promise.reject(new Error(r.status)))
    .then(mount)
    .catch(() => { $('status').innerHTML = `could not load <b>${esc(file)}</b>. <a href="${REPO}/blob/main/${esc(courseRoot)}/${esc(file)}">Read it on GitHub</a>.`; });
})();
</script>
</body>
</html>
