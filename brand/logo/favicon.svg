<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- The IE Hub ">ie" mark fitted to 16 px for browser tabs: every edge on a whole pixel. Chevron x 1-5 rows 5-12,
       i x 7-8 (dot rows 2-3), e x 10-14 rows 5-12 drawn like the large mark (square bowl, 1 px counter, open notch).
       Above 16 px use the large design (brand/logo/mark-*.svg). -->
  <style>
    .tile { fill: #d97757; } .ink { fill: #1f1d18; }
    @media (prefers-color-scheme: light) { .tile { fill: #b0532f; } .ink { fill: #faf6ee; } }
  </style>
  <rect class="tile" width="16" height="16" rx="3"/>
  <path class="ink" d="M1 5h2v1h-2zM2 6h2v1h-2zM3 7h2v1h-2zM4 8h2v2h-2zM3 10h2v1h-2zM2 11h2v1h-2zM1 12h2v1h-2zM7 2h2v2h-2zM7 5h2v8h-2zM10 5h5v2h-5zM10 7h2v1h-2zM13 7h2v1h-2zM10 8h5v2h-5zM10 10h2v1h-2zM10 11h5v2h-5z"/>
</svg>
