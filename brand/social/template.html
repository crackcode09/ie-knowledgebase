<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The IE Hub social image</title>
<!--
  One page, every social format. render.js opens it with ?format=&theme=&eyebrow=&headline=&sub= and screenshots it.
  Formats (width x height): og 1200x630, x-header 1500x500, linkedin-cover 4200x700, square 1080x1080, portrait 1080x1350.
  Layouts: "wide" (og) puts the text left and the block art right; "banner" (x-header, linkedin-cover) keeps words to the
  logo and tagline, clear of the bottom-left corner where the profile picture sits; "tall" (square, portrait) puts the
  art in a band across the top. The art is the design-system cover: an accent slab with a pixel prompt cut out of it,
  an ink block with a sparse accent checker, a muted satellite and one green chip.
-->
<style>
  @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url("../fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("../fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url("../fonts/inter-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400; font-style: italic; src: url("../fonts/inter-latin-400-italic.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("../fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("../fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
  :root, [data-theme="dark"] { --bg: #1f1d18; --text: #ede6da; --muted: #a79e89; --accent: #d97757; --green: #9cba7f; }
  [data-theme="light"] { --bg: #faf6ee; --text: #2a2721; --muted: #655d4f; --accent: #b0532f; --green: #4d7a2c; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Inter", sans-serif; }
  .card { position: relative; overflow: hidden; background: var(--bg); }
  .art { position: absolute; display: flex; justify-content: flex-end; overflow: hidden; }
  .art svg { height: 100%; width: auto; display: block; flex: none; }
  .brand { fill: var(--accent); } .ink { fill: var(--text); } .quiet { fill: var(--muted); } .built { fill: var(--green); }
  .cut { fill: var(--bg); } .px { fill: var(--accent); }
  .text { position: absolute; display: flex; flex-direction: column; }
  .logo { display: block; height: auto; }
  .eyebrow { font-family: "JetBrains Mono", monospace; color: var(--accent); letter-spacing: .04em; margin: 0; }
  .headline { font-family: "Space Grotesk", sans-serif; font-weight: 700; letter-spacing: -.02em; line-height: 1.02; margin: 0; }
  .sub { color: var(--muted); margin: 0; line-height: 1.4; }
  .tagline { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="art" id="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <rect class="brand" x="24" y="-16" width="192" height="280" rx="8"/>
      <rect class="cut" x="52" y="100" width="24" height="12"/><rect class="cut" x="64" y="112" width="24" height="12"/>
      <rect class="cut" x="76" y="124" width="24" height="12"/><rect class="cut" x="88" y="136" width="24" height="24"/>
      <rect class="cut" x="76" y="160" width="24" height="12"/><rect class="cut" x="64" y="172" width="24" height="12"/>
      <rect class="cut" x="52" y="184" width="24" height="12"/><rect class="cut" x="136" y="184" width="36" height="12"/>
      <rect class="ink" x="232" y="72" width="264" height="192" rx="8"/>
      <rect class="px" x="276" y="120" width="12" height="12"/><rect class="px" x="324" y="120" width="12" height="12"/>
      <rect class="px" x="300" y="144" width="12" height="12"/><rect class="px" x="348" y="144" width="12" height="12"/>
      <rect class="px" x="276" y="168" width="12" height="12"/><rect class="px" x="324" y="168" width="12" height="12"/>
      <rect class="px" x="300" y="192" width="12" height="12"/><rect class="px" x="348" y="192" width="12" height="12"/>
      <rect class="quiet" x="232" y="16" width="112" height="40" rx="8"/>
      <rect class="built" x="360" y="24" width="48" height="24" rx="3"/>
    </svg>
  </div>
  <div class="text" id="text"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const FORMATS = { og: [1200, 630, 'wide'], 'x-header': [1500, 500, 'banner'], 'linkedin-cover': [4200, 700, 'banner'],
                    square: [1080, 1080, 'tall'], portrait: [1080, 1350, 'tall'] };
  const [W, H, kind] = FORMATS[q.get('format') || 'og'];
  const theme = q.get('theme') === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  const card = document.getElementById('card'), art = document.getElementById('art'), text = document.getElementById('text');
  Object.assign(card.style, { width: W + 'px', height: H + 'px' });
  const TAG = 'Industrial engineering, learned and built in the open.';
  const eyebrow = q.get('eyebrow'), headline = q.get('headline'), sub = q.get('sub');
  const el = (tag, cls, txt, css) => { const e = document.createElement(tag); e.className = cls; if (txt) e.textContent = txt; Object.assign(e.style, css || {}); return e; };
  const logo = (h, css) => { const i = el('img', 'logo', '', Object.assign({ height: h + 'px' }, css || {})); i.src = `../logo/the-ie-hub-A-on-${theme}.svg`; i.alt = 'The IE Hub'; return i; };
  // The logo file carries 0.3 S of clear space (S = file height / 1.9); trim it so the logo aligns with the text edge.
  const trim = h => ({ margin: `${-h * 0.158}px 0 ${-h * 0.158}px ${-h * 0.158}px`, alignSelf: 'flex-start' });
  if (kind === 'wide') {
    const pad = H * 0.1;
    Object.assign(art.style, { top: 0, bottom: 0, right: 0, width: W * 0.40 + 'px', justifyContent: 'flex-start' });
    Object.assign(text.style, { left: pad + 'px', top: pad + 'px', bottom: pad + 'px', width: W * 0.52 - pad + 'px', justifyContent: 'space-between' });
    const top = el('div', '', '', { display: 'flex', flexDirection: 'column', gap: H * 0.035 + 'px' });
    if (eyebrow) top.append(el('p', 'eyebrow', eyebrow, { fontSize: H * 0.032 + 'px' }));
    top.append(el('h1', 'headline', headline || TAG, { fontSize: (headline && headline.length > 60 ? H * 0.085 : H * 0.1) + 'px' }));
    if (sub) top.append(el('p', 'sub', sub, { fontSize: H * 0.036 + 'px' }));
    text.append(top, logo(H * 0.13, trim(H * 0.13)));
  } else if (kind === 'banner') {
    // X shows the profile picture over the bottom-left of the header: the words sit right of it and above centre.
    const wide = W / H > 4, artW = Math.min(W * 0.36, H * 1.67);
    Object.assign(art.style, { top: 0, bottom: 0, right: 0, width: artW + 'px', justifyContent: 'flex-start' });
    const left = wide ? W * 0.30 : W * 0.22, lh = wide ? H * 0.36 : H * 0.28;
    Object.assign(text.style, { left: left + 'px', right: artW + H * 0.1 + 'px', top: 0, bottom: H * 0.12 + 'px', justifyContent: 'center', gap: H * 0.05 + 'px' });
    text.append(logo(lh, trim(lh)), el('p', 'tagline', TAG, { fontSize: (wide ? H * 0.06 : H * 0.045) + 'px' }));
  } else {
    const pad = W * 0.08;
    Object.assign(art.style, { top: 0, left: 0, right: 0, height: H * 0.36 + 'px' });
    Object.assign(text.style, { left: pad + 'px', right: pad + 'px', top: H * 0.36 + pad * 0.8 + 'px', bottom: pad + 'px', justifyContent: 'space-between' });
    const top = el('div', '', '', { display: 'flex', flexDirection: 'column', gap: W * 0.03 + 'px' });
    if (eyebrow) top.append(el('p', 'eyebrow', eyebrow, { fontSize: W * 0.028 + 'px' }));
    top.append(el('h1', 'headline', headline || TAG, { fontSize: (headline && headline.length > 60 ? W * 0.072 : W * 0.085) + 'px' }));
    if (sub) top.append(el('p', 'sub', sub, { fontSize: W * 0.032 + 'px' }));
    text.append(top, logo(W * 0.11, trim(W * 0.11)));
  }
</script>
</body>
</html>
