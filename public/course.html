<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IE Knowledgebase</title>
<meta name="description" content="Read an IE Knowledgebase course or module.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1f1d18; --surface: #2a2721; --surface-2: #343028; --line: #3e392f; --line-strong: #534c3f;
    --text: #ede6da; --muted: #a79e89; --accent: #d97757; --accent-soft: rgba(217,119,87,.14);
    --green: #9cba7f; --green-soft: rgba(156,186,127,.16); --code-bg: #181612; --code-text: #d9d2c4; --bg-rgb: 31,29,24;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: "Space Grotesk", "Inter", -apple-system, sans-serif;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 72px;
    --shadow-1: 0 1px 2px rgba(0,0,0,.25); --ease-out: cubic-bezier(.16,1,.3,1);
  }
  :root[data-theme="light"] {
    --bg: #faf6ee; --surface: #ffffff; --surface-2: #f1ebdf; --line: #e3dccb; --line-strong: #c9bfa9; --text: #2a2721; --muted: #655d4f;
    --accent: #b0532f; --accent-soft: rgba(176,83,47,.12); --green: #4d7a2c; --green-soft: rgba(77,122,44,.14);
    --code-bg: #f1ebdf; --code-text: #2a2721; --bg-rgb: 250,246,238; --shadow-1: 0 1px 2px rgba(60,40,20,.08);
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    --bg: #faf6ee; --surface: #ffffff; --surface-2: #f1ebdf; --line: #e3dccb; --line-strong: #c9bfa9; --text: #2a2721; --muted: #655d4f;
    --accent: #b0532f; --accent-soft: rgba(176,83,47,.12); --green: #4d7a2c; --green-soft: rgba(77,122,44,.14);
    --code-bg: #f1ebdf; --code-text: #2a2721; --bg-rgb: 250,246,238; --shadow-1: 0 1px 2px rgba(60,40,20,.08); } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  button { font: inherit; }
  .progress { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: linear-gradient(90deg, var(--accent), var(--green)); z-index: 30; transition: width .1s linear; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); padding: var(--s2) var(--s5);
    background: rgba(var(--bg-rgb), .92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 13px; }
  .path { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .path .dot { color: var(--green); } .path b { color: var(--text); font-weight: 500; } .path a { color: var(--muted); text-decoration: none; } .path a:hover { color: var(--accent); }
  .spacer { flex: 1; }
  .toolbar { position: sticky; top: 49px; z-index: 19; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); padding: var(--s2) var(--s5);
    background: rgba(var(--bg-rgb), .92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 13px; }
  .status { font-family: var(--mono); font-size: 12.5px; color: var(--muted); padding: 6px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-1); white-space: nowrap; }
  .status b { color: var(--green); font-weight: 500; }
  .status[hidden] { display: none; }
  .notice { margin: 0 0 var(--s5); padding: var(--s3) var(--s4); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--surface); font-size: 13px; color: var(--muted); }
  .notice b { color: var(--text); font-weight: 600; } .notice[hidden] { display: none; }
  .notice.verified { border-left-color: var(--green); }
  footer a { color: inherit; } footer a:hover { color: var(--accent); }
  @media print { .notice { border: 1px solid #999; } }
  .topbar .status { margin: 0; }
  nav.toggle a.btn { color: var(--text); } nav.toggle a.btn:hover { color: var(--accent); text-decoration: none; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12.5px; color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; text-decoration: none; transition: border-color .15s, background .15s, transform .08s var(--ease-out); }
  .btn:active { transform: scale(.96); }
  /* Controls: one height, a visible edge, a filled state for the active one */
  .btn { border-color: var(--line-strong); box-shadow: var(--shadow-1); }
  .btn { min-height: 34px; line-height: 1; font-weight: 500; }
  .btn:hover { border-color: var(--accent); background: var(--surface-2); }
  .btn.active, .btn[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); box-shadow: none; }
  .btn.icon { min-width: 34px; justify-content: center; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn.done { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .btn svg { width: 14px; height: 14px; flex: none; }
  .toggle { display: flex; } .toggle .btn { border-radius: 0; } .toggle .btn:first-child { border-radius: 6px 0 0 6px; } .toggle .btn:last-child { border-radius: 0 6px 6px 0; border-left: none; }

  .hero { display: none; }
  .hero .eyebrow { font-family: var(--mono); font-size: 13px; color: var(--green); margin-bottom: var(--s4); }
  .hero .eyebrow::before { content: "$ "; color: var(--muted); }
  .hero h1 { font-family: var(--display); font-size: clamp(30px, 5vw, 52px); font-weight: 700; letter-spacing: -.02em; line-height: 1.08; }
  .hero h1 .md { color: var(--accent); }
  .hero .byline { margin-top: var(--s4); color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .chip { font-family: var(--mono); font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 14px; color: var(--text); box-shadow: var(--shadow-1); }
  .chip.green { color: var(--green); border-color: var(--green); } .chip.accent { color: var(--accent); border-color: var(--accent); }
  .hero .lede { margin-top: var(--s4); color: var(--muted); font-size: 16px; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: var(--s6) var(--s7) 100px; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: var(--s7); }

  nav.toc { position: sticky; top: 64px; align-self: start; font-size: 13.5px; border-left: 1px solid var(--line); max-height: calc(100vh - 80px); overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  nav.toc .toc-title { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: var(--s1) 0 var(--s3) var(--s4); }
  nav.toc .toc-title + .toc-title { padding-top: var(--s5); }
  nav.toc a.course { display: block; padding: 2px var(--s4) 10px; font-family: var(--display); font-weight: 500; font-size: 14px; color: var(--text); border-left: 0; margin: 0; }
  nav.toc a.course:hover { color: var(--accent); padding-left: var(--s4); }
  nav.toc a { display: flex; gap: 8px; align-items: baseline; padding: 5px var(--s4); color: var(--muted); text-decoration: none; border-left: 2px solid transparent; margin-left: -1px; transition: color .15s, border-color .15s, padding-left .15s var(--ease-out); }
  nav.toc a:hover { color: var(--text); padding-left: 20px; }
  nav.toc a.current { color: var(--accent); border-left-color: var(--accent); }
  nav.toc a .n { font-family: var(--mono); font-size: 12.5px; color: var(--muted); width: 1.6em; flex: none; }
  nav.toc a.mdone .n { color: var(--green); }
  nav.toc a .t { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--muted); margin-left: auto; white-space: nowrap; }

  /* One width for everything in the document: prose, tables, code and figures share the same edge. About 78 characters per line. */
  .doc { min-width: 0; font-size: 17px; max-width: 78ch; }
  .dochead { display: flex; flex-direction: column; gap: 10px; padding-bottom: var(--s4); margin-bottom: var(--s4); border-bottom: 1px solid var(--line); }
  .dochead-row { display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap; }
  .dochead-row .docmeta { flex: 1 1 auto; }
  .dochead .eyebrow { font-family: var(--mono); font-size: 12px; color: var(--green); } .dochead .eyebrow::before { content: "$ "; color: var(--muted); }
  .dochead h1 { margin: 0; font-family: var(--display); font-size: clamp(26px, 3vw, 36px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
  .dochead h1 .num { color: var(--muted); font-weight: 500; }
  .docmeta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .dochead-actions { display: flex; gap: 8px; flex: none; flex-wrap: wrap; }
  .btn.done { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .status { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-bottom: var(--s5); padding: var(--s2) var(--s3); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: inline-block; box-shadow: var(--shadow-1); }
  .status b { color: var(--green); font-weight: 500; }
  .doc h1, .doc h2, .doc h3, .doc h4 { font-family: var(--display); scroll-margin-top: 80px; }
  .doc h1 { font-size: 30px; margin: var(--s5) 0 var(--s4); letter-spacing: -.01em; line-height: 1.2; }
  .doc h2 { font-size: 23px; margin: var(--s7) 0 var(--s3); padding-top: var(--s5); border-top: 1px solid var(--line); }
  .doc h2::before, .doc h3::before { content: "# "; content: "# " / ""; color: var(--accent); font-family: var(--mono); font-weight: 400; }
  .doc h3 { font-size: 18px; margin: var(--s6) 0 var(--s2); } .doc h3::before { content: "## "; content: "## " / ""; }
  .doc h4 { font-family: var(--sans); font-size: 16px; font-weight: 600; margin: var(--s5) 0 var(--s2); color: var(--text); }
  .doc p { margin: 0 0 1em; } .doc ul, .doc ol { margin: 0 0 var(--s4) 22px; } .doc li { margin-bottom: 8px; } .doc li::marker { color: var(--accent); }
  .doc blockquote { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: var(--s2) var(--s4); margin: 0 0 var(--s4); border-radius: 0 6px 6px 0; }
  .doc code { font-family: var(--mono); font-size: .88em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
  .doc pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: var(--s4) 18px; margin: 0 0 18px; overflow-x: auto; box-shadow: var(--shadow-1); }
  .doc pre code { background: none; border: none; padding: 0; font-size: 13.5px; line-height: 1.6; color: var(--code-text); }
  .doc pre.mermaid { background: var(--surface); text-align: center; }
  .doc hr { border: none; border-top: 1px solid var(--line); margin: var(--s6) 0; }
  .doc .tablewrap { overflow-x: auto; margin: 0 0 18px; }
  .doc table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
  .doc th, .doc td { border: 1px solid var(--line); padding: var(--s2) var(--s3); text-align: left; vertical-align: top; }
  .doc th { background: var(--surface); font-family: var(--sans); font-size: 13.5px; font-weight: 600; }
  .doc td { font-variant-numeric: tabular-nums; }
  .doc tbody tr:hover { background: var(--surface); }
  .doc img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #fff; display: block; margin: 0 0 var(--s4); }
  .doc figure { margin: var(--s4) 0 var(--s5); text-align: center; }
  .doc figure img { display: inline-block; margin: 0; }
  .doc figcaption { margin-top: var(--s2); font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-align: center; }
  .doc figcaption b { color: var(--text); font-weight: 500; }
  .doc details { border: 1px solid var(--line); border-radius: 8px; padding: var(--s2) var(--s4); margin: 0 0 var(--s4); background: var(--surface); }
  .doc details summary { cursor: pointer; font-family: var(--mono); font-size: 13px; color: var(--accent); }
  .doc details[open] summary { margin-bottom: var(--s2); }
  .raw { display: none; } body.raw-mode .rendered { display: none; } body.raw-mode .raw { display: block; }
  .raw pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: var(--s5); overflow-x: auto; font-family: var(--mono); font-size: 13.5px; line-height: 1.7; color: var(--code-text); counter-reset: ln; }
  .raw .ln { display: block; } .raw .ln::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 3ch; margin-right: 2ch; color: var(--muted); text-align: right; user-select: none; }
  .raw .ln.h { color: var(--accent); font-weight: 500; } .raw .ln.fence { color: var(--green); }
  .pager { display: flex; justify-content: space-between; gap: var(--s3); margin-top: var(--s7); padding-top: var(--s5); border-top: 1px solid var(--line); flex-wrap: wrap; }
  .pager a, .pager button { flex: 1; min-width: 200px; display: block; padding: var(--s3) var(--s4); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); text-decoration: none; font-family: var(--mono); font-size: 13px; cursor: pointer; text-align: left; }
  .pager a:hover, .pager button:hover { border-color: var(--accent); }
  .pager a small, .pager button small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
  .pager .next { text-align: right; } .pager .mark { flex: 0 0 auto; min-width: 0; text-align: center; }
  .pager .mark.done { border-color: var(--green); color: var(--green); background: var(--green-soft); }
  footer { border-top: 1px solid var(--line); padding: var(--s5); text-align: center; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .toc-toggle { display: none; }
  .btn.icon { padding: 6px 9px; }
  footer { line-height: 2; } footer a { color: var(--muted); } footer a:hover { color: var(--accent); }
  @media (max-width: 700px) {
    .topbar { padding: 8px var(--s3); gap: 8px; -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--bg); } .topbar .path { flex: 1; }
    .topbar nav.toggle { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; padding: 6px var(--s3) calc(6px + env(safe-area-inset-bottom));
      background: rgba(var(--bg-rgb), .96); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
    .topbar nav.toggle .btn { flex: 1; justify-content: center; min-height: 44px; padding: 10px 4px; border-radius: 8px; border-left: 1px solid var(--line-strong); }
    .topbar nav.toggle .btn + .btn { margin-left: 6px; }
    body { padding-bottom: 60px; }
    footer .keys { display: none; }
  }
  @media (max-width: 820px) {
    .toc-toggle { display: flex; width: 100%; justify-content: space-between; align-items: center; margin-bottom: var(--s2); }
    nav.toc.collapsed > :not(.toc-toggle) { display: none; }
  }
  @media (pointer: coarse) { .btn, .pager a, .pager button { min-height: 40px; } nav.toc a { padding-top: 8px; padding-bottom: 8px; } }
  @media (max-width: 820px) { .wrap, .hero { padding-left: var(--s4); padding-right: var(--s4); } .wrap { grid-template-columns: 1fr; gap: 0; } nav.toc { position: static; max-height: none; margin-bottom: var(--s5); border-left: 0; } .dochead-actions { flex: 1 1 100%; } .status .long { display: none; } .hero { padding-top: var(--s6); } }
  .skip { position: absolute; left: -9999px; top: 8px; z-index: 40; padding: 6px 10px; background: var(--accent); color: var(--bg); border-radius: 6px; font-family: var(--mono); font-size: 12.5px; } .skip:focus { left: 8px; }
  kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
  @media print {
    :root { --bg: #fff; --surface: #fff; --surface-2: #f4f4f4; --line: #ccc; --text: #000; --muted: #444; --accent: #000; --accent-soft: #eee; --green: #000; --code-bg: #f4f4f4; --code-text: #000; }
    .progress, .topbar, nav.toc, .pager, .status, footer, .cursor, .hero .lede, .dochead-actions, .dochead .eyebrow, .skip { display: none !important; }
    .doc pre { white-space: pre-wrap; overflow: visible; } .doc .tablewrap { overflow: visible; }
    .wrap { grid-template-columns: 1fr; padding: 0; } .hero { padding: 0 0 12px; } .hero h1 { font-size: 26px; }
    .doc h2 { break-after: avoid; } .doc pre, .doc img, .doc figure { break-inside: avoid; } .doc tr { break-inside: avoid; }
    .doc details { border: 0; padding: 0; } .doc details summary { display: none; } .doc details > * { display: block; }
    a { color: #000; text-decoration: none; } .doc a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 10px; color: #444; }
  }
</style>
</head>
<body>
<div class="progress" id="progress" aria-hidden="true"></div>
<a class="skip" href="#rendered">Skip to content</a>
<div class="topbar">
  <span class="path"><span class="dot">~</span>/<a href="index.html">ie-knowledgebase</a>/<span id="pathCourse"></span>/<b id="pathFile">README.md</b></span>
  <nav class="toggle" aria-label="Site views">
    <a class="btn" href="index.html">Catalog</a>
    <a class="btn" href="index.html#tab=path">Learning path</a>
    <a class="btn" href="index.html#tab=graph">Mind map</a>
  </nav>
  <span class="spacer"></span>
  <button type="button" class="btn icon" id="btnTheme" aria-label="Toggle light or dark theme" title="Theme"><svg class="bi" width="15" height="15" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 0 8 1zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16"/></svg></button>
</div>
<div class="wrap">
  <nav class="toc" id="toc" aria-label="Course contents"></nav>
  <main class="doc">
    <div class="dochead" id="dochead">
      <div class="eyebrow">cat <span id="eyebrowFile">README.md</span></div>
      <h1 id="title"></h1>
      <div class="dochead-row">
      <div class="docmeta" id="docMeta"></div>
      <div class="dochead-actions">
        <div class="toggle" role="group" aria-label="View mode"><button type="button" class="btn active" id="btnRendered" aria-pressed="true">Rendered</button><button type="button" class="btn" id="btnRaw" aria-pressed="false">Raw</button></div>
        <button type="button" class="btn" id="btnCopy">Copy</button>
        <a class="btn" id="btnGithub" target="_blank" rel="noopener"><svg class="bi" width="14" height="14" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg> GitHub</a>
        <button type="button" class="btn" id="btnMark">mark done</button>
      </div>
      </div>
    </div>
    <div class="notice" id="notice" hidden></div>
    <div class="status" id="status" role="status" hidden>loading…</div>
    <div class="rendered" id="rendered"></div>
    <div class="raw" id="rawView"><pre id="rawPre"></pre></div>
    <div class="pager" id="pager"></div>

rview Guide (20–30 minutes)", "path": "templates/interview-guide.md"}, {"label": "Prototype Test Plan", "path": "templates/prototype-test-plan.md"}, {"label": "Design Sprint Brief", "path": "templates/sprint-brief.md"}], "verified": false, "review": "", "sources": []}, {"id": "course:human-centered-ai/0", "type": "module", "label": "Human Centered Design Foundations", "parent": "course:human-centered-ai", "a": -1.1088, "path": "courses/analytics-data-science-ai/human-centered-ai/modules/01-human-centered-design-foundations.md", "note": "", "topics": "Define the core principles of human-centered design (HCD); Explain why HCD is critical to AI readiness and adoption; Describe how user needs, behaviors and constraints shape AI solutions", "tkind": "objectives", "tcount": 3}, {"id": "course:human-centered-ai/1", "type": "module", "label": "Qualitative Insight Gathering", "parent": "course:human-centered-ai", "a": -1.1088, "path": "courses/analytics-data-science-ai/human-centered-ai/modules/02-qualitative-insight-gathering.md", "note": "", "topics": "Plan and run short, open interviews and observations; Avoid leading questions and solution pitches; Practise through simulated interviews with frontline and operational roles", "tkind": "objectives", "tcount": 3}, {"id": "course:human-centered-ai/2", "type": "module", "label": "From Insights to Themes", "parent": "course:human-centered-ai", "a": -1.1088, "path": "courses/analytics-data-science-ai/human-centered-ai/modules/03-from-insights-to-themes.md", "note": "", "topics": "Synthesize interview notes into themes by affinity grouping; Use divergent then convergent thinking deliberately; Weigh themes by breadth across roles, not by how loudly they were stated", "tkind": "objectives", "tcount": 3}, {"id": "course:human-centered-ai/3", "type": "module", "label": "Opportunity Framing", "parent": "course:human-centered-ai", "a": -1.1088, "path": "courses/analytics-data-science-ai/human-centered-ai/modules/04-opportunity-framing.md", "note": "", "topics": "Write \"How might we…\" opportunity statements from themes; Check statements for the right scope; Prioritize opportunities on desirability, feasibility, viability and AI fit", "tkind": "objectives", "tcount": 3}, {"id": "course:human-centered-ai/4", "type": "module", "label": "Bridge to Design Sprints and Prototyping", "parent": "course:human-centered-ai", "a": -1.1088, "path": "courses/analytics-data-science-ai/human-centered-ai/modules/05-bridge-to-design-sprints-and-prototyping.md", "note": "", "topics": "Turn a framed opportunity into a design sprint brief; Map assumptions and choose the riskiest ones to test first; Pick quick prototypes that learn fast and de-risk assumptions, and read the results", "tkind": "objectives", "tcount": 3}, {"id": "course:human-centered-ai/5", "type": "module", "label": "Workshop: from people to prototype", "parent": "course:human-centered-ai", "a": -1.1088, "path": "courses/analytics-data-science-ai/human-centered-ai/modules/06-workshop.md", "note": "", "topics": "Steps; Skill check", "tkind": "sections", "tcount": 2}, {"id": "topic:operational-analytics", "type": "topic", "label": "Operational Analytics", "parent": "cat:analytics-data-science-ai", "a": -1.0472}, {"id": "cat:ergonomics-safety", "type": "category", "label": "Ergonomics & Safety", "a": -0.8624, "description": "Occupational ergonomics, workplace safety, and ergonomic process design.", "tag": "", "icon": "<svg class=\"bi\" width=\"18\" height=\"18\" aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"currentColor\" viewBox=\"0 0 16 16\"><path d=\"M5.338 1.59a61 61 0 0 0-2.837.856.48.48 0 0 0-.328.39c-.554 4.157.726 7.19 2.253 9.188a10.7 10.7 0 0 0 2.287 2.233c.346.244.652.42.893.533q.18.085.293.118a1 1 0 0 0 .101.025 1 1 0 0 0 .1-.025q.114-.034.294-.118c.24-.113.547-.29.893-.533a10.7 10.7 0 0 0 2.287-2.233c1.527-1.997 2.807-5.031 2.253-9.188a.48.48 0 0 0-.328-.39c-.651-.213-1.75-.56-2.837-.855C9.552 1.29 8.53 y", "path": "reference/glossary.md"}, {"label": "Solutions", "path": "solutions/README.md"}, {"label": "A3 — [Title]", "path": "templates/a3-template.md"}, {"label": "Kaizen Charter", "path": "templates/kaizen-charter-template.md"}], "verified": false, "review": "", "sources": []}, {"id": "course:kaizen-leader/0", "type": "module", "label": "Introduction: kaizen, Lean blueprint, 3 Ms, 8 wastes", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/00-introduction-to-kaizen.md", "note": "1.5 h", "topics": "Explain what a kaizen event is and when it's the right tool; Describe the structure of a kaizen: pre-work, event week, follow-up; Identify the 3 Ms and the 8 wastes in a process", "tkind": "objectives", "tcount": 3}, {"id": "course:kaizen-leader/1", "type": "module", "label": "Lean and DMAIC; kaizen measurements; baseline", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/01-lean-dmaic-and-kaizen-measurements.md", "note": "1.25 h", "topics": "Map a kaizen event onto the DMAIC phases; Choose kaizen metrics and establish baseline performance; Compute lead time with Little's law and process cycle efficiency", "tkind": "objectives", "tcount": 3}, {"id": "course:kaizen-leader/2", "type": "module", "label": "Pre-event planning: charter, SIPOC, plan", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/02-pre-event-planning.md", "note": "2.5 h", "topics": "Prepare a kaizen event: scope, team, logistics and data; Write a kaizen charter; Build a SIPOC and a Gantt-style event plan", "tkind": "objectives", "tcount": 3}, {"id": "course:kaizen-leader/3", "type": "module", "label": "Leading teams, conversations and change", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/03-leading-teams-and-change.md", "note": "2.5 h", "topics": "Lead a kaizen team through the stages of team development; Use four types of conversation to move change forward; Anticipate and manage resistance", "tkind": "objectives", "tcount": 3}, {"id": "course:kaizen-leader/4", "type": "module", "label": "Gemba walk, process maps, spaghetti diagram, takt", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/04-day1-current-state.md", "note": "2 h", "topics": "Run a gemba walk that produces facts, not opinions; Map value-added and non-value-added steps; Draw a spaghetti diagram and quantify motion; Calculate takt time and compare it with cycle times", "tkind": "objectives", "tcount": 4}, {"id": "course:kaizen-leader/5", "type": "module", "label": "Value stream mapping", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/05-value-stream-mapping.md", "note": "2 h", "topics": "Draw a current-state value stream map (VSM) with data boxes and a timeline; Calculate lead time and process cycle efficiency from the map; Sketch a future state", "tkind": "objectives", "tcount": 3}, {"id": "course:kaizen-leader/6", "type": "module", "label": "Theory of constraints", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/06-theory-of-constraints.md", "note": "45 min", "topics": "Identify a system's constraint; Apply the five focusing steps", "tkind": "objectives", "tcount": 2}, {"id": "course:kaizen-leader/7", "type": "module", "label": "Root causes and solution ideas", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/07-day2-root-causes-and-solutions.md", "note": "2.5 h", "topics": "Run Day 2 of an event: from current-state findings to root causes and a list of solution ideas; Use a fishbone, 5-Why and scatter plot inside a kaizen; Facilitate brainstorming that produces many practical ideas", "tkind": "objectives", "tcount": 3}, {"id": "course:kaizen-leader/8", "type": "module", "label": "Continuous flow, line balancing and pull", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/08-continuous-flow-balancing-and-pull.md", "note": "2.5 h", "topics": "Design a continuous-flow cell paced to takt; Balance work across operators with a yamazumi chart; Size a kanban pull loop", "tkind": "objectives", "tcount": 3}, {"id": "course:kaizen-leader/9", "type": "module", "label": "Quick changeover (SMED)", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/09-quick-changeover.md", "note": "1.25 h", "topics": "Analyze a changeover into internal and external elements; Apply the SMED steps to cut changeover time", "tkind": "objectives", "tcount": 2}, {"id": "course:kaizen-leader/10", "type": "module", "label": "FMEA, error-proofing, selecting and piloting", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/10-fmea-error-proofing-selecting-piloting.md", "note": "2 h", "topics": "Use a quick FMEA to check the new process for risks before running it; Error-proof the new process; Select solutions and run a pilot during the event", "tkind": "objectives", "tcount": 3}, {"id": "course:kaizen-leader/11", "type": "module", "label": "A3 problem solving", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/11-a3-problem-solving.md", "note": "45 min", "topics": "Tell the story of a kaizen on one A3 sheet; Use the A3 as a coaching and communication tool", "tkind": "objectives", "tcount": 2}, {"id": "course:kaizen-leader/12", "type": "module", "label": "Control charts revisited, 5S, visual management", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/12-day5-control-charts-5s-visual-management.md", "note": "1.5 h", "topics": "Use a process behavior chart to show whether the kaizen changed performance; Implement 5S in the new area and audit it; Design visual management so anyone can see the cell's status in seconds", "tkind": "objectives", "tcount": 3}, {"id": "course:kaizen-leader/13", "type": "module", "label": "Control plan, TPM, standard work, close-out", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/13-control-plan-tpm-standard-work-close-out.md", "note": "2 h", "topics": "Write the control plan and standard work for the new process; Calculate OEE and explain TPM's role in sustaining the gains; Run the report-out and the 30/60/90-day follow-up", "tkind": "objectives", "tcount": 3}, {"id": "course:kaizen-leader/14", "type": "module", "label": "The one-day, ten-step kaizen", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/14-team-member-one-day-kaizen.md", "note": "1 day", "topics": "The ten steps; Example — one-day kaizen: kanban for seal kits; Check yourself", "tkind": "sections", "tcount": 3}, {"id": "course:kaizen-leader/15", "type": "module", "label": "Capstone: plan and lead a kaizen", "parent": "course:kaizen-leader", "a": 0.9856, "path": "courses/lean-six-sigma/kaizen-leader/modules/15-capstone.md", "note": "4–6 h", "topics": "Option A — Real event; Option B — Paper case: order-entry kaizen (transactional); Rubric", "tkind": "sections", "tcount": 3}, {"id": "topic:lean-it-essentials-for-leaders-and-teams", "type": "topic", "label": "Lean IT Essentials for Leaders and Teams", "parent": "cat:lean-six-sigma", "a": 1.0472}, {"id": "course:lean-methods-accelerator", "type": "course", "label": "Lean Methods Accelerator", "parent": "cat:lean-six-sigma", "path": "courses/lean-six-sigma/lean-methods-accelerator/README.md", "a": 1.1088, "length": "~18 h", "description": "A free, open, standalone course covering the Lean enterprise toolkit end to end — from cost of poor quality and the Lean blueprint, through value stream mapping, takt, line balancing and benchmarking, to continuous flow and c n-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/02-blueprint-yfx-dmaic-thought-maps.md", "note": "60 min", "topics": "Explain the Lean \"house\" and why stability comes first; Use Y = f(X) to focus on the inputs that drive results; Describe the DMAIC phases and where Lean tools fit; Plan a project's reasoning with a thought process map", "tkind": "objectives", "tcount": 4}, {"id": "course:lean-methods-accelerator/3", "type": "module", "label": "Source of value, gemba walks, 3 Ms and 8 wastes", "parent": "course:lean-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/03-value-gemba-wastes.md", "note": "60 min", "topics": "Define value from the customer's point of view; Conduct a gemba walk; Recognize the 3 Ms and the 8 wastes", "tkind": "objectives", "tcount": 3}, {"id": "course:lean-methods-accelerator/4", "type": "module", "label": "Process maps, value-added flow charts, spaghetti diagrams", "parent": "course:lean-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/04-process-maps-va-spaghetti.md", "note": "60 min", "topics": "Choose the right type of process map; Build a value-added flow chart; Draw and measure a spaghetti diagram", "tkind": "objectives", "tcount": 3}, {"id": "course:lean-methods-accelerator/5", "type": "module", "label": "Process metrics and takt time", "parent": "course:lean-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/05-process-metrics-and-takt.md", "note": "45 min", "topics": "Define and calculate core process metrics; Use takt time to set the pace of work", "tkind": "objectives", "tcount": 2}, {"id": "course:lean-methods-accelerator/6", "type": "module", "label": "Value stream mapping (incl. extended value stream)", "parent": "course:lean-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/06-value-stream-mapping.md", "note": "75 min", "topics": "Draw a current-state value stream map with data and a timeline; Calculate lead time and PCE; Extend the map beyond the plant to suppliers and customers; Design a future state", "tkind": "objectives", "tcount": 4}, {"id": "course:lean-methods-accelerator/7", "type": "module", "label": "Line balancing and heijunka", "parent": "course:lean-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/07-line-balancing-and-heijunka.md", "note": "50 min", "topics": "Balance work to takt across operators; Explain heijunka (level loading) by volume and mix", "tkind": "objectives", "tcount": 2}, {"id": "course:lean-methods-accelerator/8", "type": "module", "label": "Measurement and data types; Pareto charts", "parent": "course:lean-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/08-data-types-and-pareto.md", "note": "45 min", "topics": "Distinguish discrete from continuous data and choose measurements accordingly; Build and interpret a Pareto chart", "tkind": "objectives", "tcount": 2}, {"id": "course:lean-methods-accelerator/9", "type": "module", "label": "Benchmarking", "parent": "course:lean-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/09-benchmarking.md", "note": "35 min", "topics": "Choose the type of benchmarking for a purpose; Quantify performance gaps and use them to set goals", "tkind": "objectives", "tcount": 2}, {"id": "course:lean-methods-accelerator/10", "type": "module", "label": "Kaizen", "parent": "course:lean-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/10-kaizen.md", "note": "40 min", "topics": "Explain daily kaizen and kaizen events; Outline how a kaizen event is planned and run", "tkind": "objectives", "tcount": 2}, {"id": "course:lean-methods-accelerator/11", "type": "module", "label": "A3 and 5-Why, 1-How", "parent": "course:lean-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/11-a3-and-5why.md", "note": "50 min", "topics": "Tell a problem-solving story on one A3 page; Use 5-Why, 1-How to reach a root cause and countermeasure", "tkind": "objectives", "tcount": 2}, {"id": "course:lean-methods-accelerator/12", "type": "module", "label": "DFSS and design for Lean: supply chain dynamics", "parent": "course:lean-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/12-dfss-and-design-for-lean.md", "note": "60 min", "topics": "Explain when to design (DFSS) rather than improve (DMAIC); Explain the bullwhip effect and design supply chains that dampen it", "tkind": "objectives", "tcount": 2}, {"id": "course:lean-methods-accelerator/13", "type": "module", "label": "Error-proofing", "parent": "course:lean-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/13-error-proofing.md", "note": "35 min", "topics": "Apply error-proofing (poka-yoke) at the source; Rank countermeasures by strength", "tkind": "objectives", "tcount": 2}, {"id": "course:lean-methods-accelerator/14", "type": "module", "label": "Continuous flow and cellular processing", "parent": "course:lean-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/14-continuous-flow-and-cells.md", "note": "60 min", "topics": "Explain the benefits and prerequisites of continuous flow; Form product families and cells with a product–process matrix; Lay out a cell", "tkind": "objectives", "tcount": 3}, {"id": "course:lean-methods-accelerator/15", "type": "module", "label": "Quick changeover", "parent": "course:lean-methods-accelerator", "a": 1.1088, "path": "courses/lean-six-sigma/lean-methods-accelerator/modules/15-quick-changeover.md", "note": "60 min", "topics": "Apply the SMED steps to reduce changeover time; Show how shorter changeove .7248, "path": "courses/lean-six-sigma/measurement-and-basic-statistics/modules/06-pareto-charts.md", "note": "35 min", "topics": "Decide when a Pareto chart is the right tool; Construct and interpret a Pareto chart; Recognize that the \"vital few\" depend on what you measure", "tkind": "objectives", "tcount": 3}, {"id": "course:measurement-and-basic-statistics/7", "type": "module", "label": "Histograms", "parent": "course:measurement-and-basic-statistics", "a": 1.7248, "path": "courses/lean-six-sigma/measurement-and-basic-statistics/modules/07-histograms.md", "note": "35 min", "topics": "Construct a histogram showing the relative frequency of observations in each category (bin); Read shape, center and spread from a histogram; Recognize shapes that signal mixed or distorted data", "tkind": "objectives", "tcount": 3}, {"id": "course:measurement-and-basic-statistics/8", "type": "module", "label": "Understanding variation: why averages mislead", "parent": "course:measurement-and-basic-statistics", "a": 1.7248, "path": "courses/lean-six-sigma/measurement-and-basic-statistics/modules/08-understanding-variation.md", "note": "35 min", "topics": "Explain why every process varies; Show how averages can hide important information; Distinguish common-cause from special-cause variation", "tkind": "objectives", "tcount": 3}, {"id": "course:measurement-and-basic-statistics/9", "type": "module", "label": "Measuring central tendency", "parent": "course:measurement-and-basic-statistics", "a": 1.7248, "path": "courses/lean-six-sigma/measurement-and-basic-statistics/modules/09-central-tendency.md", "note": "30 min", "topics": "Compute the mean, median and mode; Choose the right measure of center for the data's shape; Locate the center of a process", "tkind": "objectives", "tcount": 3}, {"id": "course:measurement-and-basic-statistics/10", "type": "module", "label": "Quantifying process variability", "parent": "course:measurement-and-basic-statistics", "a": 1.7248, "path": "courses/lean-six-sigma/measurement-and-basic-statistics/modules/10-quantifying-variability.md", "note": "35 min", "topics": "Compute range, variance, standard deviation, IQR and coefficient of variation; Choose a spread measure that fits the data; Assess whether a process's variation is acceptable relative to its requirements", "tkind": "objectives", "tcount": 3}, {"id": "course:measurement-and-basic-statistics/11", "type": "module", "label": "The normal distribution", "parent": "course:measurement-and-basic-statistics", "a": 1.7248, "path": "courses/lean-six-sigma/measurement-and-basic-statistics/modules/11-normal-distribution.md", "note": "35 min", "topics": "Describe the normal distribution and the empirical rule; Compute and use z-scores; Estimate the fraction of output beyond a specification limit — and know when not to trust it", "tkind": "objectives", "tcount": 3}, {"id": "course:measurement-and-basic-statistics/12", "type": "module", "label": "Wrap-up and skill check", "parent": "course:measurement-and-basic-statistics", "a": 1.7248, "path": "courses/lean-six-sigma/measurement-and-basic-statistics/modules/12-skill-check.md", "note": "30 min", "topics": "Part A — Quiz (answers below); Part B — Mini-project (optional)", "tkind": "sections", "tcount": 2}, {"id": "course:root-cause-analysis", "type": "course", "label": "Root Cause Analysis", "parent": "cat:lean-six-sigma", "path": "courses/lean-six-sigma/root-cause-analysis/README.md", "a": 1.7864, "length": "~14 h", "description": "A free, open course on finding and removing the real causes of problems — from a clear problem statement, through qualitative tools (process maps, fishbones, 5-Why, root cause trees) to statistical proof (stratification, correlation, multiple and logistic regression), and on to solutions that stick. One case runs through every module: leaking valve bodies from a three-machine cell. No prerequisites; Measurement & Basic Statistics helps.", "search": "Problem statements, Pareto, process maps, fishbone, 5-Why, root cause trees, stratification, regression, logistic regression, corrective actions", "extras": [{"label": "Formulas and Quick Reference", "path": "reference/formulas.md"}, {"label": "Further Reading", "path": "reference/further-reading.md"}, {"label": "Glossary", "path": "reference/glossary.md"}, {"label": "Solutions", "path": "solutions/README.md"}], "verified": false, "review": "", "sources": []}, {"id": "course:root-cause-analysis/0", "type": "module", "label": "Introduction and the RCA framework", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/00-introduction-and-framework.md", "note": "45 min", "topics": "Distinguish symptoms, direct causes and root causes; Distinguish containment, correction, corrective action and preventive action; Follow a structured root cause framework", "tkind": "objectives", "tcount": 3}, {"id": "course:root-cause-analysis/1", "type": "module", "label": "Writing effective problem statements", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/01-problem-statements.md", "note": "40 min", "topics": "Write a problem statement that is specific, measurable and free of causes and solutions; Use 5W2H and Is / Is-Not analysis to bound a problem", "tkind": "objectives", "tcount": 2}, {"id": "course:root-cause-analysis/2", "type": "module", "label": "Solving problems with statistics: measurement and metrics", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/02-statistics-and-metrics.md", "note": "30 min", "topics": "Choose metrics that show the size and behavior of a problem; Check that the data can be trusted before analyzing them", "tkind": "objectives", "tcount": 2}, {"id": "course:root-cause-analysis/3", "type": "module", "label": "Pareto charts", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/03-pareto-charts.md", "note": "40 min", "topics": "Construct and interpret Pareto charts by count and by cost; Use second-level Pareto charts to focus the investigation", "tkind": "objectives", "tcount": 2}, {"id": "course:root-cause-analysis/4", "type": "module", "label": "Process flow charts and swim lanes", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/04-process-maps-and-swim-lanes.md", "note": "40 min", "topics": "Map a process to see where problems can enter; Use swim lanes to show handoffs between people and departments", "tkind": "objectives", "tcount": 2}, {"id": "course:root-cause-analysis/5", "type": "module", "label": "Cause-and-effect diagram", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/05-cause-and-effect-diagram.md", "note": "45 min", "topics": "Build a cause-and-effect diagram to identify and organize potential causes; Separate potential causes from verified causes", "tkind": "objectives", "tcount": 2}, {"id": "course:root-cause-analysis/6", "type": "module", "label": "5-Why, 1-How", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/06-five-why-one-how.md", "note": "40 min", "topics": "Drill from a symptom to a root cause by asking \"why\" until cause connects to effect; Check the chain in both directions and attach a \"how\" (countermeasure)", "tkind": "objectives", "tcount": 2}, {"id": "course:root-cause-analysis/7", "type": "module", "label": "Root cause tree and comprehensive root cause mapping", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/07-root-cause-tree-and-mapping.md", "note": "75 min", "topics": "Build a root cause tree for problems with several interacting causes; Use AND/OR logic to show how causes combine; Apply the tree to a case study", "tkind": "objectives", "tcount": 3}, {"id": "course:root-cause-analysis/8", "type": "module", "label": "Root cause stratification", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/08-stratification.md", "note": "45 min", "topics": "Stratify problem data by potential sources to locate causes; Test whether a difference between strata is real", "tkind": "objectives", "tcount": 2}, {"id": "course:root-cause-analysis/9", "type": "module", "label": "Scatter plots and correlation", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/09-scatter-plots-and-correlation.md", "note": "50 min", "topics": "Use a scatter plot to examine the relationship between two variables; Measure the strength of a linear relationship with the correlation coefficient; Avoid the classic correlation traps", "tkind": "objectives", "tcount": 3}, {"id": "course:root-cause-analysis/10", "type": "module", "label": "Simple regression", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/10-simple-regression.md", "note": "50 min", "topics": "Fit and interpret a straight-line model Y = b₀ + b₁X; Use the model to set a process limit; Check residuals", "tkind": "objectives", "tcount": 3}, {"id": "course:root-cause-analysis/11", "type": "module", "label": "Multiple regression", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/11-multiple-regression.md", "note": "90 min", "topics": "Fit a multiple regression model Y = f(X₁, X₂, …); Identify the significant process inputs; Recognize and handle correlated inputs (multicollinearity)", "tkind": "objectives", "tcount": 3}, {"id": "course:root-cause-analysis/12", "type": "module", "label": "Binary logistic regression", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/12-logistic-regression.md", "note": "75 min", "topics": "Model a pass/fail output as a function of process inputs; Interpret coefficients as odds ratios and predicted probabilities; Use the model to set an input limit", "tkind": "objectives", "tcount": 3}, {"id": "course:root-cause-analysis/13", "type": "module", "label": "Error-proofing", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/13-error-proofing.md", "note": "40 min", "topics": "Design countermeasures that prevent a verified root cause from recurring; Rank countermeasures by strength", "tkind": "objectives", "tcount": 2}, {"id": "course:root-cause-analysis/14", "type": "module", "label": "Prioritizing and selecting a solution", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/14-prioritizing-and-selecting-solutions.md", "note": "45 min", "topics": "Use a weighted decision matrix to select and prioritize solutions; Complement it with an impact/effort view", "tkind": "objectives", "tcount": 2}, {"id": "course:root-cause-analysis/15", "type": "module", "label": "Corrective action matrix and verification", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/15-corrective-action-matrix.md", "note": "45 min", "topics": "Track improvement actions with a corrective action matrix; Verify that actions worked and are sustained", "tkind": "objectives", "tcount": 2}, {"id": "course:root-cause-analysis/16", "type": "module", "label": "Capstone", "parent": "course:root-cause-analysis", "a": 1.7864, "path": "courses/lean-six-sigma/root-cause-analysis/modules/16-capstone.md", "note": "3–4 h", "topics": "Option A — Your own problem; Option B — Course data challenge; Rubric", "tkind": "sections", "tcount": 3}, {"id": "topic:lean-six-sigma-yellow-belt", "type": "topic", "label": "Lean Six Sigma Yellow Belt", "parent": "cat:lean-six-sigma", "a ": 2.2792}, {"id": "topic:introduction-to-supply-chain-management", "type": "topic", "label": "Introduction to Supply Chain Management", "parent": "cat:logistics-supply-chain", "a": 2.3408}, {"id": "topic:demand-forecasting", "type": "topic", "label": "Demand Forecasting", "parent": "cat:logistics-supply-chain", "a": 2.4024}, {"id": "topic:inventory-management", "type": "topic", "label": "Inventory Management", "parent": "cat:logistics-supply-chain", "a": 2.464}, {"id": "topic:warehousing-management", "type": "topic", "label": "Warehousing Management", "parent": "cat:logistics-supply-chain", "a": 2.5256}, {"id": "cat:quality-operational-excellence", "type": "category", "label": "Quality & Operational Excellence", "a": 2.6796, "description": "Quality fundamentals, cost of quality, quality engineering, and statistical quality control.", "tag": "", "icon": "<svg class=\"bi\" width=\"18\" height=\"18\" aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"currentColor\" viewBox=\"0 0 16 16\"><path fill-rule=\"evenodd\" d=\"M10.354 6.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7 8.793l2.646-2.647a.5.5 0 0 1 .708 0\"/><path d=\"m10.273 2.513-.921-.944.715-.698.622.637.89-.011a2.89 2.89 0 0 1 2.924 2.924l-.01.89.636.622a2.89 2.89 0 0 1 0 4.134l-.637.622.011.89a2.89 2.89 0 0 1-2.924 2.924l-.89-.01-.622.636a2.89 2.89 0 0 1-4.134 0l-.622-.637-.89.011a2.89 2.89 0 0 1-2.924-2.924l.01-.89-.636-.622a2.89 2.89 0 0 1 0-4.134l.637-.622-.011-.89a2.89 2.89 0 0 1 2.924-2.924l.89.01.622-.636a2.89 2.89 0 0 1 4.134 0l-.715.698a1.89 1.89 0 0 0-2.704 0l-.92.944-1.32-.016a1.89 1.89 0 0 0-1.911 1.912l.016 1.318-.944.921a1.89 1.89 0 0 0 0 2.704l.944.92-.016 1.32a1.89 1.89 0 0 0 1.912 1.911l1.318-.016.921.944a1.89 1.89 0 0 0 2.704 0l.92-.944 1.32.016a1.89 1.89 0 0 0 1.911-1.912l-.016-1.318.944-.921a1.89 1.89 0 0 0 0-2.704l-.944-.92.016-1.32a1.89 1.89 0 0 0-1.912-1.911z\"/><\/svg>", "path": "courses/quality-operational-excellence/READ   const courses = nodes.filter(d => d.type === 'course');
  const byRoot = new Map(courses.map(c => [c.path.replace(/\/README\.md$/, ''), c]));
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = id => document.getElementById(id);

  // ---- theme
  const root = document.documentElement;
  try { const saved = localStorage.getItem('iekb-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  $('btnTheme').addEventListener('click', () => {
    const dark = root.getAttribute('data-theme') === 'dark' || (!root.getAttribute('data-theme') && !matchMedia('(prefers-color-scheme: light)').matches);
    const next = dark ? 'light' : 'dark'; root.setAttribute('data-theme', next);
    try { localStorage.setItem('iekb-theme', next); } catch (e) {}
    if (window.mermaid) runMermaid();
  });

  // ---- progress stores (course-level and module-level), this browser only
  const load = k => { try { return new Set(JSON.parse(localStorage.getItem(k) || '[]')); } catch (e) { return new Set(); } };
  const save = (k, s) => { try { localStorage.setItem(k, JSON.stringify([...s])); } catch (e) {} };
  const doneCourses = load('iekb-done'), doneMods = load('iekb-mods');

  // ---- which course and file
  const params = new URLSearchParams(location.search);
  const course = courses.find(c => c.id === 'course:' + (params.get('c') || ''));
  if (!course) {
    $('title').textContent = 'Course not found';
    $('status').hidden = false; $('status').innerHTML = `No course called <b>${esc(params.get('c') || '')}</b>. <a href="index.html">Back to the catalog</a>.`;
    $('dochead').querySelector('.dochead-actions').hidden = true;
    return;
  }
  const slug = course.id.slice(7), slugQ = encodeURIComponent(slug);
  const courseRoot = course.path.replace(/\/README\.md$/, '');
  let file = resolve('', (params.get('f') || 'README.md').split('?')[0]);
  if (!/\.md$/i.test(file) || file.includes('..') || !file) file = 'README.md';
  const modules = nodes.filter(n => n.type === 'module' && n.parent === course.id).map(m => ({ ...m, rel: m.path.slice(courseRoot.length + 1) }));
  const extras = course.extras || [];
  const cat = byId.get(course.parent);
  const modKey = rel => `${courseRoot}/${rel}`;
  const isReadme = file === 'README.md';

  // ---- site status and back link

  // ---- hero and nav
  $('pathCourse').innerHTML = `<a href="index.html#course:${esc(slug)}">${esc(slug)}</a>`;
  $('btnMark').setAttribute('aria-pressed', 'false');
  const curMod = modules.find(m => m.rel === file);
  $('pathFile').textContent = curMod ? String(modules.indexOf(curMod)).padStart(2, '0') : file.split('/').pop(); $('eyebrowFile').textContent = file;
  document.title = `${course.label} · IE Knowledgebase`;
  $('btnGithub').href = `${REPO}/blob/main/${courseRoot}/${file}`;
  let docLines = 0;
  const kindWord = m => m.tcount ? `${m.tcount} ${({ objectives: m.tcount === 1 ? 'objective' : 'objectives', topics: m.tcount === 1 ? 'topic' : 'topics', sections: m.tcount === 1 ? 'section' : 'sections' })[m.tkind] || 'topics'}` : '';
  function renderNotice() {
    const n = $('notice');
    if (course.verified) { n.className = 'notice verified'; n.innerHTML = `<b>Verified.</b> Reviewed against the <a href="${REPO}/blob/main/REVIEW.md" rel="noopener">review checklist</a>: ${esc(course.review)}.`; }
    else n.innerHTML = `<b>Draft.</b> This course was written with AI assistance and has not yet been verified by a reviewer. Check figures, formulas and claims before relying on them. Only public IISE course titles and topic outlines were used as a map; the text, data and exercises are original. See the <a href="terms.html#originality">originality notice</a>.`;
    n.hidden = false;
  }
  function renderHero() {
    const cur = modules.find(m => m.rel === file);
    const extra = extras.find(x => x.path === file);
    if (cur) $('title').innerHTML = `<span class="num">${String(modules.indexOf(cur)).padStart(2, '0')}</span> ${esc(cur.label)}`;
    else if (extra) $('title').textContent = extra.label;
    else $('title').textContent = course.label;
    const parts = [];
    if (cur) { if (cur.note) parts.push(cur.note); if (kindWord(cur)) parts.push(kindWord(cur)); }
    else if (isReadme) { parts.push(cat.label); if (course.length) parts.push(course.length); parts.push(`${modules.length} modules`); }
    if (docLines) parts.push(`${docLines} lines`);
    $('docMeta').innerHTML = parts.map(esc).join(' · ');
    const d = cur ? doneMods.has(modKey(file)) : doneCourses.has(course.id);
    const b = $('btnMark'); b.classList.toggle('done', d); b.setAttribute('aria-pressed', String(d)); b.textContent = cur ? (d ? '✓ module done' : 'mark done') : (d ? '✓ course done' : 'mark course done');
    b.style.display = (cur || isReadme) ? '' : 'none';
  }
  function renderToc() {
    const doneN = modules.filter(m => doneMods.has(modKey(m.rel))).length;
    const cur = f => f === file ? 'class="current" aria-current="page"' : '';
    let h = '<div class="toc-title">Course</div>' + `<a href="course.html?c=${slugQ}" class="course">${esc(course.label)}</a>` + `<a href="course.html?c=${slugQ}" ${isReadme ? 'class="current" aria-current="page"' : ''}><span class="n">#</span>Overview</a>`;
    h += `<div class="toc-title">Modules · ${doneN} of ${modules.length} done</div>` + modules.map((m, i) => `<a href="course.html?c=${slugQ}&f=${encodeURIComponent(m.rel)}" class="${m.rel === file ? 'current' : ''} ${doneMods.has(modKey(m.rel)) ? 'mdone' : ''}" ${m.rel === file ? 'aria-current="page"' : ''} title="${esc(m.topics || '')}"><span class="n">${doneMods.has(modKey(m.rel)) ? '✓' : i}</span><span>${esc(m.label)}</span>${m.note ? `<span class="t">${esc(m.note)}</span>` : ''}</a>`).join('');
    if (extras.length) h += '<div class="toc-title">Reference</div>' + extras.map(x => `<a href="course.html?c=${slugQ}&f=${encodeURIComponent(x.path)}" ${cur(x.path)}><span class="n">·</span><span>${esc(x.label)}</span></a>`).join('');
    const doneAll = `${doneN} of ${modules.length} done`;
    const wasOpen = $('toc').classList.contains('open');
    $('toc').innerHTML = `<button type="button" class="btn toc-toggle" aria-expanded="${wasOpen}" aria-controls="toc"><span>Contents · ${esc(doneAll)}</span><span aria-hidden="true">${wasOpen ? '▴' : '▾'}</span></button>` + h;
    $('toc').classList.toggle('collapsed', !wasOpen);
    $('toc').querySelector('.toc-toggle').addEventListener('click', () => { const open = $('toc').classList.toggle('open'); $('toc').classList.toggle('collapsed', !open); renderToc(); });
    const curEl = $('toc').querySelector('a.current'); if (curEl) curEl.scrollIntoView({ block: 'nearest' });
  }

  // ---- path helpers for rewriting links and images
  function resolve(base, href) {
    const parts = (base ? base.split('/').slice(0, -1) : []).concat(href.split('/'));
    const out = [];
    for (const p of parts) { if (p === '..') out.pop(); else if (p !== '.' && p !== '') out.push(p); }
    return out.join('/');
  }
  function rewriteLinks(container) {
    container.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (/^(https?:|mailto:|#)/.test(href)) { if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; } return; }
      const [pathq, hash] = href.split('#');
      const path = pathq.split('?')[0], frag = hash ? '#' + hash : '';
      if (!path) return;                                        // "#section" handled above; "?x" alone is not a file
      const inCourse = resolve(file, path);               // relative to this course root
      const absolute = resolve(courseRoot + '/' + file, path); // relative to repo root
      if (/\.md$/i.test(path)) {
        if (absolute.startsWith(courseRoot + '/')) {
          a.href = `course.html?c=${slugQ}&f=${encodeURIComponent(inCourse)}${frag}`;
        } else {
          const other = [...byRoot.keys()].find(r => absolute === r + '/README.md' || absolute.startsWith(r + '/'));
          a.href = other ? `course.html?c=${encodeURIComponent(byRoot.get(other).id.slice(7))}&f=${encodeURIComponent(absolute.slice(other.length + 1))}${frag}` : `${REPO}/blob/main/${absolute}${frag}`;
        }
      } else {
        // data files, scripts and spreadsheets: raw download for binaries, GitHub view for the rest
        const raw = /\.(xlsx|xlsm|csv|zip|pdf|docx|pptx)$/i.test(path);
        a.href = `${REPO}/${raw ? 'raw' : 'blob'}/main/${absolute}${frag}`; a.target = '_blank'; a.rel = 'noopener';
      }
    });
    container.querySelectorAll('img[src]').forEach(img => {
      const src = img.getAttribute('src');
      if (/^(https?:|data:|\/\/)/.test(src)) return;
      img.src = '../' + courseRoot + '/' + resolve(file, src);
    });
  }

  // ---- render
  let RAW = '';
  function renderRaw(md) {
    return md.replace(/\r\n/g, '\n').split('\n').map(l => { let c = 'ln'; if (/^#{1,6}\s/.test(l)) c += ' h'; else if (/^```/.test(l)) c += ' fence'; return `<span class="${c}">${esc(l) || ' '}</span>`; }).join('');
  }
  const dec = s => { try { return decodeURIComponent(s); } catch (e) { return s; } };
  // Heading ids the way GitHub makes them, so links written against GitHub keep working here.
  function headingIds(el) {
    const used = new Map();
    el.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(h => {
      if (h.id) return;
      let base = h.textContent.toLowerCase().replace(/[^\p{L}\p{N} _-]/gu, '').trim().replace(/ /g, '-');
      if (!base) base = 'section';
      const n = used.get(base) || 0; used.set(base, n + 1);
      let id = n ? `${base}-${n}` : base;
      if (document.getElementById(id)) id = 'h-' + id;   // never collide with the page's own ids (status, title, notice...)
      h.id = id;
    });
  }
  function runMermaid() {
    const dark = getComputedStyle(root).getPropertyValue('--bg').trim() === '#1f1d18';
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral' });
    document.querySelectorAll('pre.mermaid').forEach(p => { p.removeAttribute('data-processed'); p.textContent = p.dataset.src; });
    mermaid.run().catch(err => {
      document.querySelectorAll('pre.mermaid').forEach(p => { if (!p.querySelector('svg')) { p.textContent = p.dataset.src; p.insertAdjacentHTML('beforebegin', '<p class="status">This diagram could not be rendered; its source is shown instead.</p>'); } });
    });
  }
  function mount(md) {
    RAW = md;
    $('rawPre').innerHTML = renderRaw(md);
    docLines = md.split('\n').length; renderHero();
    if (typeof marked === 'undefined') {
      setMode(true);
      $('status').hidden = false; $('status').textContent = 'The markdown renderer could not be loaded from cdnjs, so the raw text is shown.';
      return;
    }
    marked.use({ gfm: true, breaks: false });
    const el = $('rendered');
    el.innerHTML = marked.parse(md);
    const firstH1 = el.querySelector('h1'); if (firstH1 && firstH1 === el.firstElementChild) firstH1.remove();  // the document header already shows the title
    headingIds(el);
    el.querySelectorAll('table').forEach(tb => { const w = document.createElement('div'); w.className = 'tablewrap'; tb.replaceWith(w); w.appendChild(tb); });
    // A paragraph holding only an image becomes a numbered figure; the alt text is the caption.
    let figN = 0;
    el.querySelectorAll('p > img:only-child').forEach(img => {
      const p = img.parentElement; if (p.textContent.trim()) return;
      figN += 1; const fig = document.createElement('figure'); const cap = document.createElement('figcaption');
      const alt = img.getAttribute('alt') || '';
      cap.innerHTML = `<b>Figure ${figN}.</b> ${esc(alt)}`; img.id = img.id || `figure-${figN}`;
      p.replaceWith(fig); fig.appendChild(img); fig.appendChild(cap);
    });
    rewriteLinks(el);
    const mer = [...el.querySelectorAll('pre > code.language-mermaid')];
    if (mer.length) {
      mer.forEach(c => { const pre = c.parentElement; const d = document.createElement('pre'); d.className = 'mermaid'; d.dataset.src = c.textContent; d.textContent = c.textContent; pre.replaceWith(d); });
      if (window.mermaid) runMermaid();
      else {
        const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js';
        s.integrity = 'sha512-6a80OTZVmEJhqYJUmYd5z8yHUCDlYnj6q9XwB/gKOEyNQV/Q8u+XeSG59a2ZKFEHGTYzgfOQKYEBtrZV7vBr+Q=='; s.crossOrigin = 'anonymous';
        s.onload = runMermaid;
        s.onerror = () => document.querySelectorAll('pre.mermaid').forEach(p => p.insertAdjacentHTML('beforebegin', '<p class="status">The diagram library could not be loaded; the diagram source is shown instead.</p>'));
        document.body.appendChild(s);
      }
    }
    if (location.hash) { const tg = document.getElementById(dec(location.hash.slice(1))); if (tg) tg.scrollIntoView(); }
    updateProgress();
  }
  function renderPager() {
    const i = modules.findIndex(m => m.rel === file);
    const prev = i > 0 ? modules[i - 1] : (i === 0 ? { rel: 'README.md', label: 'Overview' } : null);
    const next = i >= 0 && i < modules.length - 1 ? modules[i + 1] : (isReadme && modules.length ? modules[0] : null);
    const link = (m, cls, lab) => m ? `<a class="${cls}" href="course.html?c=${esc(slug)}${m.rel === 'README.md' ? '' : '&f=' + encodeURIComponent(m.rel)}"><small>${lab}</small>${esc(m.label)}</a>` : '<span style="flex:1"></span>';
    let mark = '';
    if (i >= 0) { const k = modKey(file), d = doneMods.has(k); mark = `<button type="button" class="mark ${d ? 'done' : ''}" id="markMod"><small>progress</small>${d ? '✓ module done' : 'mark module done'}</button>`; }
    else if (isReadme) { const d = doneCourses.has(course.id); mark = `<button type="button" class="mark ${d ? 'done' : ''}" id="markCourse"><small>progress</small>${d ? '✓ course done' : 'mark course done'}</button>`; }
    $('pager').innerHTML = link(prev, 'prev', 'previous') + mark + link(next, 'next', 'next');
    const mm = $('markMod'); if (mm) mm.addEventListener('click', () => { const k = modKey(file); if (doneMods.has(k)) doneMods.delete(k); else doneMods.add(k); save('iekb-mods', doneMods);
      if (modules.every(m => doneMods.has(modKey(m.rel)))) doneCourses.add(course.id); else doneCourses.delete(course.id);
      save('iekb-done', doneCourses);
      renderHero(); renderToc(); renderPager(); });
    const mc = $('markCourse'); if (mc) mc.addEventListener('click', () => { if (doneCourses.has(course.id)) doneCourses.delete(course.id); else doneCourses.add(course.id); save('iekb-done', doneCourses); renderHero(); renderPager(); });
  }

  // ---- chrome
  function setMode(raw) { document.body.classList.toggle('raw-mode', raw); $('btnRaw').classList.toggle('active', raw); $('btnRendered').classList.toggle('active', !raw); $('btnRaw').setAttribute('aria-pressed', String(raw)); $('btnRendered').setAttribute('aria-pressed', String(!raw)); }
  $('btnRendered').addEventListener('click', () => setMode(false)); $('btnRaw').addEventListener('click', () => setMode(true));
  $('btnMark').addEventListener('click', () => { const b = $('markMod') || $('markCourse'); if (b) b.click(); });
  $('btnCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(RAW); $('btnCopy').textContent = 'Copied'; setTimeout(() => $('btnCopy').textContent = 'Copy', 1500); } catch (e) { setMode(true); } });
  function updateProgress() { const h = document.documentElement; const max = h.scrollHeight - h.clientHeight; $('progress').style.width = (max > 0 ? 100 * h.scrollTop / max : 0) + '%'; }
  window.addEventListener('scroll', updateProgress, { passive: true });
  document.addEventListener('keydown', e => {
    if (e.repeat || e.isComposing || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || e.target.closest('input,textarea,select,[contenteditable]')) return;
    if (e.key === 'ArrowLeft') { const a = document.querySelector('.pager a.prev'); if (a) location.href = a.href; }
    if (e.key === 'ArrowRight') { const a = document.querySelector('.pager a.next'); if (a) location.href = a.href; }
    if (e.key === 'd') { const b = $('markMod') || $('markCourse'); if (b) b.click(); }
    if (e.key === 'r') setMode(!document.body.classList.contains('raw-mode'));
  });

  // ---- boot
  renderHero(); renderNotice(); renderToc(); renderPager();
  fetch(`../${courseRoot}/${file}`, { cache: 'no-store' })
    .then(r => r.ok ? r.text() : Promise.reject(new Error(r.status)))
    .then(md => { try { mount(md); } catch (err) { setMode(true); $('status').hidden = false; $('status').textContent = 'The page could not be rendered, so the raw text is shown.'; } },
          () => { $('status').hidden = false; $('status').innerHTML = `could not load <b>${esc(file)}</b>. <a href="${REPO}/blob/main/${esc(courseRoot)}/${esc(file)}">Read it on GitHub</a>.`; });
})();
</script>
</body>
</html>
