name: Checks

# Runs on every pull request into dev or main, and on pushes to dev.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# Read-only token: these checks never write to the repository.
permissions:
  contents: read

jobs:
  site:
    name: Site is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # CONTRIBUTING: never edit public/ by hand. Rebuild it from the templates and
      # course READMEs (standard library only) and fail if anything differs.
      - name: Rebuild the site
        run: python tools/roadmap_graph.py

      - name: Fail if public/ or ROADMAP.md is out of date
        run: |
          # status, not diff: a regenerated page that was never committed is untracked and must fail too
          changes=$(git status --porcelain --untracked-files=all -- public ROADMAP.md)
          if [ -n "$changes" ]; then
            echo "::error::The generated site is out of date. Run 'python tools/roadmap_graph.py' and commit the result."
            echo "$changes"
            git diff --stat
            exit 1
          fi

  course-checks:
    name: Course checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.4.6 scipy==1.17.1

      # Charting Process Behavior: recompute the control-chart constants by numerical
      # integration and compare with the tables in spc.py. The script prints ALL OK.
      - name: Charting Process Behavior constants
        working-directory: courses/lean-six-sigma/charting-process-behavior
        run: |
          python tools/check_constants.py | tee check.out
          grep -qx "ALL OK" check.out
